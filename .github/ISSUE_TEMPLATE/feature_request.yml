name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This plugin has no runtime dependencies and no build step, and it is meant
        to stay that way. Feature requests that fit that constraint are much easier
        to accept.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including anything you can already do today with per-model `arguments` or the management API.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This can be done without adding a runtime dependency
          required: false
        - label: This can be done without a build step (the settings page is hand-written)
          required: false
